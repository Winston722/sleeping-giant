name: sync-league
# Sleeper league state sync. Runs on GitHub's runners because the Sleeper API is
# unreachable from the assistant's sandbox.

# The Sleeper API is unreachable from the assistant's sandbox, so the sync runs
# here instead — GitHub's runners have open network — and commits the result back.
on:
  workflow_dispatch: {}
  schedule:
    # Times are UTC. Chosen around the fantasy week:
    - cron: "0 13 * * 3"   # Wednesday, after waivers clear
    - cron: "0 16 * * 5"   # Friday, ahead of the weekend
    - cron: "0 15 * * 0"   # Sunday, before the early kickoffs

permissions:
  contents: write
  issues: write        # the failure alarm below files/comments on an issue

concurrency:
  group: sync-league
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull league state from Sleeper
        run: python sync.py

      - name: Commit refreshed data
        run: |
          git config user.name "dave-sync[bot]"
          git config user.email "dave-sync@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sync league state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # WHY THIS EXISTS, and why it is worded more calmly than its sibling.
      # A red scheduled run is invisible unless somebody opens the Actions
      # tab. dave-ledger's `snapshot.yml` learned that the expensive way: it
      # failed silently for ten days on a ModuleNotFoundError and captured
      # nothing. This is the same silent-failure class, so it gets the same
      # alarm.
      #
      # BUT THE STAKES ARE GENUINELY DIFFERENT AND THE MESSAGE SAYS SO. The
      # snapshot captures observables that carry no history, so a missed
      # capture time is gone for good. THIS job reads current league state
      # from the Sleeper API, which always serves the present -- a later run
      # recovers everything except the fact that the state was briefly stale.
      # Borrowing the snapshot's urgency here would train the reader to
      # discount both alarms, which is how the real one gets ignored.
      #
      # One issue is reused across consecutive failures rather than opening a
      # new one each time, so a persistent outage nags once and then accrues
      # comments.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Sleeper league sync is failing"
          existing=$(gh issue list --state open --search "$title in:title" \
                       --json number,title \
                       --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          body=$(printf '%s\n' \
            "The scheduled Sleeper league sync failed on $(date -u +%F)." \
            "" \
            "**Nothing is unrecoverable.** The Sleeper API serves current state," \
            "so re-running this workflow restores everything -- the only cost is" \
            "that \`data/league_state.json\` was stale in the meantime. That" \
            "matters because DAVE derives replacement level from who is actually" \
            "rostered, so a stale file quietly values free agents as though they" \
            "were still taken." \
            "" \
            "**To recover:** fix the cause and dispatch this workflow manually." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
